# Cifra local dev — flare-system-c-chain-indexer config (Coston2).
#
# Feeds the fce-sign ext-proxy's DB dependency by self-hosting the indexer,
# so we don't need Flare's shared indexer creds. Run against the cloned repo:
#   cd ../reference/flare-system-c-chain-indexer
#   go run ./cmd/indexer --config <abs path>/Cifra/infra/indexer/config.toml
#
# DB name `flare_ftso_indexer` MUST match the ext-proxy [db].database.

[indexer]
mode = "fsp"            # index only FSP contracts (resolved via on-chain ContractRegistry) — what the proxy queries
start_index = 0         # ignored in fsp mode
stop_index = 0          # index indefinitely
history_epochs = 4      # proxy needs signing-policy events for recent reward epochs (offset 2 + buffer); logs backfill is fast on Ankr
rpc_concurrency = 20     # Ankr handles it; higher throughput shrinks the steady-state lag
batch_size = 500        # block/tx fetch batch (getBlockByNumber — not subject to the getLogs cap)
log_range = 1000        # Ankr allows up to ~1000-block eth_getLogs spans
new_block_check_millis = 500    # Ankr is fast; poll aggressively so continuous mode keeps up with block production
confirmations = 1
no_new_blocks_delay_warning = 120

# FSP mode merges these user collectors with its defaults (see indexer's
# TestNormalizeIndexerConfig_FspMergesDefaultAndUserCollectors). The FSP defaults
# do NOT include the TEE registry, so without this the ext-proxy never sees the
# TeeInstructionsSent events → never forwards instructions to our TEE → FTDC
# providers get 404 on /action/result and the availability cosign never lands.
[[indexer.collect_logs]]
contract_address = "0x1a9C4A0f9D76c0b1D91d22E24E573a9b377618aE"  # FlareTeeManager diamond (TeeExtensionRegistry/TeeMachineRegistry)
topic = "undefined"                                              # index all its events

[logger]
level = "INFO"
file = "./logs/cifra-cchain-indexer.log"
console = true

[chain]
node_url = "https://rpc.ankr.com/flare_coston2"  # no 30-block getLogs cap (allows 1000), ~0.37s latency
api_key = ""
chain_type = 1          # Avalanche-based C-chain

[db]
host = "localhost"
port = 3306
database = "flare_ftso_indexer"
username = "root"
password = "root"
log_queries = false
drop_table_at_start = false
history_drop = 86400    # 1 day — dev only, we don't need 42 days of retention

[timeout]
backoff_max_elapsed_time_seconds = 300
rpc_timeout_millis = 10000
